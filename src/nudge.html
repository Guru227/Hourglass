<!DOCTYPE html>
<html lang="en" data-theme="crt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hourglass — still paused</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Undecorated window: the border below is the only frame it gets. */
    html, body { overflow: hidden; cursor: default; }
    body {
      background: var(--backdrop);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .nudge {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 26px;
      border: 2px solid var(--fg-dim);
      border-radius: 10px;
      text-align: center;
    }
    .glyph { font-size: 30px; line-height: 1; color: var(--fg-dim); }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 1.5px;
      color: var(--fg);
    }
    [data-theme="crt"] h1 { text-shadow: 0 0 8px var(--card-glow); }
    .elapsed { margin: 0; font-size: 14px; color: var(--fg-dim); letter-spacing: .5px; }
    .buttons { display: flex; gap: 12px; width: 100%; margin-top: 10px; }
    .buttons .btn { flex: 1; font-size: 14px; padding: 12px 8px; }
  </style>
</head>
<body>
  <div class="nudge" role="alertdialog" aria-labelledby="nudgeHeading">
    <div class="glyph" aria-hidden="true">‖</div>
    <h1 id="nudgeHeading">Timer still off</h1>
    <p class="elapsed" id="elapsed">Reminders have been paused for a while.</p>
    <div class="buttons">
      <button class="btn btn-primary" id="resumeBtn">Switch on timer</button>
      <button class="btn btn-ghost" id="snoozeBtn">Snooze 30 min</button>
    </div>
  </div>

  <script src="nudge.js"></script>
</body>
</html>
